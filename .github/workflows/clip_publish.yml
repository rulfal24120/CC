name: clip_publish
on:
  schedule:
    - cron: '0 5 * * *'   # 12:00 WIB
    - cron: '0 12 * * *'  # 19:00 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clip_publish
  cancel-in-progress: false

jobs:
  publish:
    # Sengaja tidak aktif untuk trial.
    # Aktifkan dengan mengubah `if: false` → `if: true` setelah storage persisten siap.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install deps
        run: pip install -r requirements_clips.txt

      - name: Run publish
        env:
          SLOT: ${{ github.event.schedule == '0 5 * * *' && '1' || '2' }}
          ZER_API_KEY: ${{ secrets.ZER_API_KEY }}
          ZER_ID_YT: ${{ secrets.ZER_ID_YT }}
          ZER_ID_FB: ${{ secrets.ZER_ID_FB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m clipper.run_publish

      - name: Commit state
        if: always()
        run: |
          git config user.name "apaiya-bot"
          git config user.email "bot@apaiya.local"
          git add state/ history_clips.json || true
          git diff --cached --quiet || git commit -m "chore(state): publish ${{ github.run_id }} [skip ci]"
          git push || true
