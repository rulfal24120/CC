name: clip_produce

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL YouTube sumber"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clip_produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements_clips.txt') }}

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install torch CPU
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.4.1+cpu torchvision==0.19.1+cpu

      - name: Pin setuptools for pkg_resources
        run: |
          pip install "setuptools>=71,<79" wheel

      - name: Install whisper (no-deps, no-build-isolation)
        run: |
          pip install --no-deps --no-build-isolation openai-whisper==20240930

      - name: Install deps (yt-dlp + PO Token plugin)
        run: |
          pip install -U -r requirements_clips.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small-v1

      - name: Download font
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            curl -fsSL -o assets/fonts/Poppins-Bold.ttf \
              https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi

      - name: Prepare YouTube cookies
        env:
          COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$COOKIES_B64" ]; then
            echo "$COOKIES_B64" | base64 -d > cookies.txt
            echo "cookies.txt siap ($(wc -l < cookies.txt) baris)"
          else
            echo "Secret YOUTUBE_COOKIES_B64 kosong"
          fi

      - name: Install Deno (JS runtime untuk yt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Start PO Token Provider (Docker sidecar)
        run: |
          docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider

      - name: Wait for PO Token Provider
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then
              echo "PO Token Provider siap di port 4416 (percobaan $i)"
              exit 0
            fi
            echo "Menunggu provider... ($i/30)"
            sleep 2
          done
          echo "Provider tidak merespons; log container:"
          docker logs bgutil-provider
          exit 1

      - name: Show provider logs (diagnostik)
        if: always()
        run: |
          echo "=== container status ==="
          docker ps -a --filter name=bgutil-provider
          echo "=== recent logs ==="
          docker logs --tail 50 bgutil-provider || true

      - name: Verify yt-dlp + plugin (correct way)
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          echo "=== yt-dlp version ==="
          yt-dlp --version
          echo "=== plugin modules (cek yt_dlp_plugins) ==="
          python -c "import yt_dlp_plugins; print('yt_dlp_plugins:', yt_dlp_plugins.__file__)"
          echo "=== verbose extractor info (harus ada [pot] PO Token Providers) ==="
          yt-dlp -v --simulate "https://www.youtube.com/watch?v=BaW_jenozKc" 2>&1 | grep -E "\[pot\]|PO Token|bgutil" || echo "Tidak ada baris [pot] di output; plugin mungkin belum ter-load"

      - name: Sanity check
        run: python -m py_compile clipper/*.py

      - name: Run produce
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLIP_MODEL: ${{ vars.GEMINI_CLIP_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YTDLP_COOKIES_FILE: cookies.txt
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_CLIPS: "5"
          MIN_CLIP_SCORE: "7.0"
          MIN_CLIP_SEC: "40"
          MAX_CLIP_SEC: "60"
          MAX_SOURCE_MINUTES: "60"
          MAX_SOURCE_MB: "2048"
        run: python -m clipper.run_produce

      - name: Dump provider logs on failure
        if: failure()
        run: |
          echo "=== container status ==="
          docker ps -a --filter name=bgutil-provider
          echo "=== logs ==="
          docker logs --tail 200 bgutil-provider || true

      - name: Commit history
        if: always()
        run: |
          git config user.name "apaiya-bot"
          git config user.email "bot@apaiya.local"
          git add history_clips.json || true
          git diff --cached --quiet || git commit -m "chore(history): run ${{ github.run_id }} [skip ci]"
          git push || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produce-${{ github.run_id }}
          path: |
            build_clips/
            output_clips/
          retention-days: 1

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, requests
          reason = "unknown"
          if os.path.isfile("build_clips/failed_reason.txt"):
              reason = open("build_clips/failed_reason.txt").read()
          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": f"Pipeline produce gagal: {reason[:500]}\n{os.environ['GH_RUN_URL']}",
              },
              timeout=15,
          )
          PY

      - name: Stop PO Token Provider
        if: always()
        run: docker stop bgutil-provider || true
