name: clip_produce

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL sumber (YouTube atau Google Drive)"
        required: true
        type: string
      verbose:
        description: "Log verbose yt-dlp (1=aktif, untuk debug bot-check)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: clip_produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements_clips.txt') }}

      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-small-${{ runner.os }}-v1

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install deps
        run: |
          pip install -U -r requirements_clips.txt

      - name: Download font
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            curl -fsSL -o assets/fonts/Poppins-Bold.ttf \
              https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi

      - name: Prepare YouTube cookies
        env:
          COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$COOKIES_B64" ]; then
            echo "$COOKIES_B64" | base64 -d > cookies.txt
            echo "cookies.txt siap ($(wc -l < cookies.txt) baris)"
          else
            echo "Secret YOUTUBE_COOKIES_B64 kosong"
          fi

      - name: Install Deno (JS runtime untuk yt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Pull PO Token Provider image (latest)
        run: |
          docker pull brainicism/bgutil-ytdlp-pot-provider:latest

      - name: Start PO Token Provider (Docker sidecar)
        run: |
          docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest

      - name: Wait for PO Token Provider
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then
              echo "PO Token Provider siap di port 4416 (percobaan $i)"
              exit 0
            fi
            echo "Menunggu provider... ($i/30)"
            sleep 2
          done
          echo "Provider tidak merespons; log container:"
          docker logs bgutil-provider
          exit 1

      - name: Verify yt-dlp + plugin
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          yt-dlp --version
          yt-dlp -v --simulate "https://www.youtube.com/watch?v=BaW_jenozKc" 2>&1 | grep -E "\[pot\]|PO Token|bgutil" || echo "Tidak ada baris [pot]"

      - name: Sanity check
        run: python -m py_compile clipper/*.py

      - name: Run produce
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLIP_MODEL: ${{ vars.GEMINI_CLIP_MODEL }}
          GEMINI_MODEL_CHAIN: "gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YTDLP_COOKIES_FILE: cookies.txt
          YTDLP_VERBOSE: ${{ github.event.inputs.verbose }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_CLIPS: "3"
          MIN_CLIP_SCORE: "4.0"
          MIN_CLIP_SEC: "25"
          MAX_CLIP_SEC: "65"
          MAX_SOURCE_MINUTES: "60"
          MAX_SOURCE_MB: "2048"
          ALLOW_FALLBACK_SELECTION: "1"
          BGM_MOOD: "penasaran"
        run: python -m clipper.run_produce

      - name: Dump provider logs on failure
        if: failure()
        run: |
          docker ps -a --filter name=bgutil-provider
          docker logs --tail 200 bgutil-provider || true

      - name: Commit history & pool
        if: always()
        run: |
          git config user.name "apaiya-bot"
          git config user.email "bot@apaiya.local"
          git add history_clips.json || true
          git add state/publish_pool.json || true
          git diff --cached --quiet || git commit -m "chore(history): run ${{ github.run_id }} [skip ci]"
          git push || true

      - name: Upload artifacts (ringkas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produce-${{ github.run_id }}
          path: |
            build_clips/transcript.json
            build_clips/selected_clips.json
            build_clips/failed_reason.txt
            output_clips/
          retention-days: 1
          if-no-files-found: ignore

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, requests
          reason = "unknown"
          if os.path.isfile("build_clips/failed_reason.txt"):
              reason = open("build_clips/failed_reason.txt").read()
          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": f"Pipeline produce gagal: {reason[:500]}\n{os.environ['GH_RUN_URL']}",
              },
              timeout=15,
          )
          PY

      - name: Stop PO Token Provider
        if: always()
        run: docker stop bgutil-provider || true
