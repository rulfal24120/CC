name: clip_produce

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL sumber (YouTube atau Google Drive)"
        required: true
        type: string
      verbose:
        description: "Log verbose yt-dlp (1=aktif)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: clip_produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # turun dari 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements_clips.txt') }}

      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-${{ vars.WHISPER_MODEL || 'small' }}-${{ runner.os }}-v1

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install deps
        run: pip install -U -r requirements_clips.txt

      - name: Download font
        run: |
          mkdir -p assets/fonts
          [ -f assets/fonts/Poppins-Bold.ttf ] || \
            curl -fsSL -o assets/fonts/Poppins-Bold.ttf \
              https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf

      # --- Setup YouTube hanya jika sumber BUKAN Drive ---
      - name: Detect source kind
        id: src
        run: |
          URL="${{ github.event.inputs.source_url }}"
          if [[ "$URL" == *"drive.google.com"* ]]; then
            echo "kind=drive" >> "$GITHUB_OUTPUT"
          else
            echo "kind=youtube" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare YouTube cookies
        if: steps.src.outputs.kind == 'youtube'
        env:
          COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$COOKIES_B64" ]; then
            echo "$COOKIES_B64" | base64 -d > cookies.txt
          fi

      - name: Install Deno
        if: steps.src.outputs.kind == 'youtube'
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Start PO Token Provider
        if: steps.src.outputs.kind == 'youtube'
        run: |
          docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then
              echo "PO Token siap ($i)"; exit 0
            fi
            sleep 1
          done
          docker logs bgutil-provider; exit 1

      - name: Sanity check
        run: python -m py_compile clipper/*.py

      - name: Run produce
        id: run_produce
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLIP_MODEL: ${{ vars.GEMINI_CLIP_MODEL }}
          GEMINI_MODEL_CHAIN: "gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YTDLP_COOKIES_FILE: cookies.txt
          YTDLP_VERBOSE: ${{ github.event.inputs.verbose }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          TARGET_CLIPS: "3"
          MIN_CLIP_SCORE: "4.0"
          MIN_CLIP_SEC: "25"
          MAX_CLIP_SEC: "65"
          MAX_SOURCE_MINUTES: "60"
          MAX_SOURCE_MB: "2048"
          ALLOW_FALLBACK_SELECTION: "1"
          BGM_MOOD: "penasaran"
        run: python -m clipper.run_produce

      - name: Commit history & pool
        if: always()
        run: |
          git config user.name "apaiya-bot"
          git config user.email "bot@apaiya.local"
          git add history_clips.json state/publish_pool.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(history): run ${{ github.run_id }} [skip ci]"
          git push || true

      # ❌ Upload artifact DIHAPUS — klip dikirim via Telegram, debug di log

      - name: Notify failure
        if: failure() && steps.run_produce.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, requests
          reason = "unknown"
          if os.path.isfile("build_clips/failed_reason.txt"):
              reason = open("build_clips/failed_reason.txt").read()
          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["TELEGRAM_CHAT_ID"],
                    "text": f"Pipeline produce gagal: {reason[:500]}\n{os.environ['GH_RUN_URL']}"},
              timeout=15,
          )
          PY

      - name: Stop PO Token Provider
        if: always() && steps.src.outputs.kind == 'youtube'
        run: docker stop bgutil-provider 2>/dev/null || true
