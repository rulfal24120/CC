name: Automata Reels Factory Workflows

on:
  schedule:
    # Jam 12:00 PM EST (17:00 UTC) -> 00:00 WIB
    - cron: '0 17 * * *'
    # Jam 07:00 PM EST (00:00 UTC) -> 07:00 WIB
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual dari tombol Run workflow di GitHub UI

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          # Fix policy ImageMagick (Mendukung ImageMagick versi 6 & 7)
          sudo find /etc/ImageMagick* -name "policy.xml" -exec sed -i 's/policy domain="path" rights="none" pattern="@\*"/policy domain="path" rights="read | write" pattern="@\*"/' {} +

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Main Production Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Upload Output Video as GitHub Artifact (Backup Storage)
        uses: actions/upload-artifact@v4
        with:
          name: Reels-Video-Product
          path: output/final_reels.mp4
          retention-days: 3
          if-no-files-found: warn
